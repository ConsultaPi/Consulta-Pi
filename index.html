
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta cualquier dígito entre el primer y el millonésimo decimal de Pi.">
  <title>Consulta Pi</title>
<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () {
    (window.vaq = window.vaq || []).push(arguments);
  };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<!-- Vercel Speed Insights -->
<script>
  window.si = window.si || function () {
    (window.siq = window.siq || []).push(arguments);
  };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#101f33; --text:#f3f7ff; --muted:#a8b7cc; --cyan:#5ee7e1; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:radial-gradient(ellipse at top,#142b47 0%,var(--bg) 62%); color:var(--text); }
    main { width:min(100%,560px); padding:clamp(24px,5vw,42px); border:1px solid #29415e; border-radius:24px; background:rgba(16,31,51,.92); box-shadow:0 24px 80px #0005; }
    .symbol { color:var(--cyan); font-size:42px; line-height:1; font-weight:700; letter-spacing:-3px; text-align:center; }
    h1 { margin:12px 0 8px; font-size:clamp(30px,7vw,42px); text-align:center; }
    .intro { margin:0 0 28px; color:var(--muted); line-height:1.55; }
    label { display:block; margin-bottom:9px; font-weight:650; }
    input { width:100%; padding:15px 16px; border-radius:12px; border:1px solid #49627f; background:#081524; color:var(--text); font-size:18px; outline:none; }
    input:focus { border-color:var(--cyan); box-shadow:0 0 0 3px #5ee7e122; }
    button { width:100%; margin-top:13px; padding:15px; border:0; border-radius:12px; color:#06131e; background:linear-gradient(100deg,var(--cyan),#9ce9ff); font-size:16px; font-weight:750; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    .hint { margin:10px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
    #result { display:none; margin-top:24px; padding:8px 20px; border-radius:16px; text-align:center; background:#081524; border:1px solid #2a4663; }
    #result.show { display:block; }
    .result-label { color:var(--muted); font-size:14px; }
    #digit { margin:6px 0 0; font-size:clamp(54px,14vw,78px); line-height:1.1; font-weight:800; color:var(--cyan); }
    #message { color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
    footer { margin-top:24px; text-align:center; color:#8294ac; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <div class="symbol" style="text-align: center;">π = 3.14159…</div>
    <h1 style="text-align: center;">Consulta Pi</h1>
    <p class="intro" style="text-align: center;">Descubre cuál es el dígito que se encuentra en una posición cualquiera dentro de Pi.</p>
    <form id="form">
      <label for="position" style="display:block; text-align:center;">Introduce una posición desde 1 hasta 1 000 000</label>
      <input id="position" name="position" type="text" inputmode="numeric" pattern="[0-9]{1,7}" maxlength="7" placeholder="Por ejemplo: 100" style="text-align: center;" required oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,7); this.setCustomValidity(this.value && (Number(this.value)<1 || Number(this.value)>1000000) ? 'La posición debe ser de 1 a 1000000. Inténtalo de nuevo.' : '')" oninvalid="this.setCustomValidity('La posición debe ser de 1 a 1000000. Inténtalo de nuevo.')">
      <button id="submit" type="submit">Consultar dígito</button>
    </form>

    <section id="result" aria-live="polite">
      <div class="result-label" id="result-label">Dígito encontrado</div>
      <div id="digit">—</div>
      <div id="message"></div>
    </section>

    <footer>Una herramienta gratuita y sencilla para explorar los dígitos de π.</footer>
  </main>

<script>
  const form = document.querySelector("#form");
  const input = document.querySelector("#position");
  const button = document.querySelector("#submit");
  const result = document.querySelector("#result");
  const digitEl = document.querySelector("#digit");
  const message = document.querySelector("#message");
  const label = document.querySelector("#result-label");

  let piDigitsPromise;

  async function loadPiDigits() {
    if (!piDigitsPromise) {
      piDigitsPromise = fetch("./1-1000000.txt", { cache: "force-cache" })
        .then(response => {
          if (!response.ok) {
            throw new Error("No se pudo cargar el archivo TXT.");
          }
          return response.text();
        })
        .then(text => {
          const digits = text.replace(/\s/g, "");
          if (digits.length !== 1000000 || !/^\d{1000000}$/.test(digits)) {
            throw new Error("El archivo no contiene exactamente un millón de dígitos.");
          }
          return digits;
        })
        .catch(error => {
          piDigitsPromise = null;
          throw error;
        });
    }
    return piDigitsPromise;
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const position = Number(input.value);

    result.classList.add("show");

    if (!Number.isSafeInteger(position) || position < 1 || position > 1000000) {
      digitEl.textContent = "—";
      label.textContent = "Posición no válida";
      message.textContent = "La posición debe ser de 1 a 1000000. Inténtalo de nuevo.";
      return;
    }

    button.disabled = true;
    button.textContent = "Consultando…";
    digitEl.textContent = "…";
    label.textContent = "Buscando la posición " + position;
    message.textContent = "Leyendo el archivo de dígitos de Pi.";

    try {
      const digits = await loadPiDigits();
      digitEl.textContent = digits[position - 1];
      label.textContent = "El dígito de la posición " + position + " de Pi es";
      message.textContent = "";
    } catch (error) {
      digitEl.textContent = "—";
      label.textContent = "No se pudo leer el archivo";
      message.textContent = "Comprueba que 1-1000000.txt esté junto a index.html y que la página se abra desde un servidor web.";
    } finally {
      button.disabled = false;
      button.textContent = "Consultar dígito";
    }
  });
</script>
</body>
</html>
